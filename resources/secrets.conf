# ----------------------------------------------------------------------
# Example Secrets
# ----------------------------------------------------------------------
# This file holds credentials referenced via substitution. Keep this
# file out of version control.
# ----------------------------------------------------------------------

secrets {

  twitch {
    clientId = "<YOUR_TWITCH_CLIENT_ID>"     # [required] Twitch API client ID.
    token    = "<YOUR_TWITCH_BEARER_TOKEN>"  # [required] Twitch API bearer token.
  }

  cloudflareR2 {
    accountId = "<YOUR_CLOUDFLARE_ACCOUNT_ID>"     # [required] Cloudflare account ID.
    accessKey = "<YOUR_R2_ACCESS_KEY>"             # [required] R2 access key.
    secretKey = "<YOUR_R2_SECRET_KEY>"             # [required] R2 secret access key.
    bucket    = "<YOUR_BUCKET_NAME>"               # [required] R2 bucket name.
    publicUrl = "https://<YOUR_SUBDOMAIN>.r2.dev"  # [required] Public base URL.
  }

  awsS3 {
    accessKey = "<YOUR_AWS_ACCESS_KEY>"              # [required] AWS access key.
    secretKey = "<YOUR_AWS_SECRET_KEY>"              # [required] AWS secret access key.
    bucket    = "<YOUR_BUCKET_NAME>"                 # [required] S3 bucket name.
    publicUrl = "https://<BUCKET>.s3.amazonaws.com"  # [required] Public base URL.
  }

  instagram {
    accountId = "<YOUR_INSTAGRAM_ACCOUNT_ID>"    # [required] Instagram business account ID.
    accessKey = "<YOUR_INSTAGRAM_ACCESS_TOKEN>"  # [required] Instagram Graph API access token.
  }

}
